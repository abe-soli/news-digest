<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AIニュースダイジェスト{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="site-title"><a href="{{ url_for('main.index') }}">AIニュースダイジェスト</a></h1>
      <nav class="site-nav">
        <a href="{{ url_for('main.index') }}">今日</a>
        <a href="{{ url_for('main.archive') }}">過去一覧</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>ニュース取得・要約は毎朝6時（JST）を想定</small>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/speech.js') }}"></script>
</body>
</html>
